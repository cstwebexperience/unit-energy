<!DOCTYPE html><html><head><meta charset="UTF-8"><script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;background:#5a1a0a;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font:12px sans-serif;color:#fff}model-viewer{width:100%;height:200px;--progress-bar-color:transparent}div{text-align:center}</style></head><body>
<script>for(const m of ['bolt','ice','blackberry','raspberry','strawberry','orange','apple','lemon','peach','blueberry','cherry','leaves'])document.write(`<div><model-viewer src="../assets/${m}.glb" environment-image="neutral" exposure="1.2" camera-orbit="30deg 70deg 105%"></model-viewer>${m}</div>`)</script>
</body></html>
